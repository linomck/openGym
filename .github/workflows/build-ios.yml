name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Install dependencies & build mobile bundle
        run: |
          cd frontend
          npm ci
          npm run build:mobile

      - name: Build Xcode Archive
        run: |
          cd frontend
          VER="$(node -p "require('./package.json').version")"
          BUILD="$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' android/app/build.gradle | sed -n 1p)"
          [ -n "$BUILD" ] || { echo "could not read versionCode" >&2; exit 1; }
          
          cd ios/App
          pod install

          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            MARKETING_VERSION="$VER" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tail -40

      - name: Package IPA
        run: |
          cd frontend
          VER="$(node -p "require('./package.json').version")"
          cd ios/App
          rm -rf Payload && mkdir Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/openGym-$VER-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "openGym-$VER-unsigned.ipa" > "openGym-$VER-unsigned.ipa.sha256"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openGym-unsigned-ipa
          path: |
            openGym-*-unsigned.ipa
            openGym-*-unsigned.ipa.sha256
          retention-days: 30
